<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.face {
    position: relative;
    height: 500px;
    width: 500px;
    background-color: brown;
    border-radius: 50%;
    display: inline-block;
}

.eyeL {
    position: absolute;
    height: 70px;
    width:70px;
    background-color: #bbb;
    border-radius: 50%;
    left: 500px;
    bottom: 400px ;
}

.eyeR {
    position: absolute;
    height: 70px;
    width:70px;
    background-color: #bbb;
    border-radius: 50%;
    left: 650px;
    bottom: 400px ;
}

.browL {
    position: absolute;
    width: 140px;
    height: 25px;
    background-color: black;
    left: 450px;
    bottom: 70%;
}

.browR {
    position: absolute;
    width: 140px;
    height: 25px;
    background-color: black;
    right: 450px;
    bottom: 500px;
}

.mouth {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 100px solid transparent;
    border-right: 100px solid transparent;
    border-top: 100px solid black;
    left: 42%;
    bottom: 30%;
}

</style>
</head>
<body>

<div style="text-align:center">
  <span class="face"></span>
  <span class="eyeL"></span>
  <span class="eyeR"></span>
  <span class="browL"></span>
  <span class="browR"></span>
  <span class="mouth"></span>

</div>

</body>
</html>
